# =============================================================================
# GPU Screen Recorder — Windows Port — single production pipeline
#
# The ENTIRE production pipeline lives in this ONE workflow file, per the
# project brief (§59):
#
#     build  →  test  →  package  →  release
#
# All compilation, testing, packaging and releasing happens here on a
# GitHub-hosted Windows x64 runner. Nothing is ever built locally.
#
# Release policy (§84):
#   * Pushes to `main` run build + test + package (validation).
#   * A GitHub Release is created ONLY from a version tag
#     (e.g. `v6.0.0-w1`) or an explicit workflow_dispatch with a version
#     input — never for a trivial commit.
#
# The effective version flows from the build job's `version` output:
#   * workflow_dispatch with a `version` input → that version
#   * a `v*` tag push → the tag minus the leading `v`
#   * anything else (plain main push / PR) → the current dev version
#     (6.0.0-w3, matching GSR_VERSION_STR in CMakeLists.txt)
#
# PHASE STATUS (docs/implementation-roadmap.md):
#   Phase 1: build job ran a toolchain smoke test (tests/ci-smoke).
#   Phase 2: the build job builds the real portable engine core (upstream
#            sources + Windows shims) with MinGW-w64; the test job runs
#            the unit tests. Active: build + test.
#   Phase 3-12: coverage build + report, render/recorder/NVENC/audio/
#            replay/IPC self-tests, engine exe + gsr-cli, UI module + RPC
#            + golden tests, startup integration — all active steps.
#   Phase 13: package job (Inno Setup installer + portable ZIP with the
#            original logo/version resources) is active on every push.
#   Phase 14: release job is conditional — it runs only on a `v*` tag
#            push or a workflow_dispatch with a version input, and
#            auto-generates release notes (version, upstream pins, commit
#            SHA, Windows-specific changes, limitations, hardware notes,
#            attribution).
# =============================================================================

name: Windows Release Pipeline

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 6.0.0-w1). Empty = build+test only."
        required: false
        default: ""

# Only one run per branch at a time: a new push cancels the stale run
# instead of queueing behind it. This keeps the iterate-to-green loop from
# piling up orphaned runs (the cache-save step below is a known hang point,
# and without this a stuck run blocks the runner for the full timeout).
concurrency:
  group: windows-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # BUILD
  # -------------------------------------------------------------------------
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 120
    # The version every downstream job (package naming, release) uses.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Effective version: dispatch input wins, then a v* tag (minus the
      # leading v), then the dev default. Package/release consume this so
      # a tagged build ships with the tagged version, not the dev one.
      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $ref = "${{ github.ref }}"
            if ($ref -like 'refs/tags/v*') { $v = $ref.Substring(11) }
            else { $v = "6.0.0-w3" }
          }
          Write-Host "effective version: $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Print toolchain versions
        shell: pwsh
        run: |
          Write-Host "=== Toolchain versions ==="
          cmake --version

      # MSYS2 MINGW64 provides the MinGW-w64 GCC toolchain. The MSYS
      # packages (make, patch) and mingw-w64 packages are both installed
      # here. gcovr runs under the mingw64 python (a native Windows
      # python): the .gcno files embed Windows-style paths (D:/...), which
      # the MSYS python would mangle, so mingw-w64-python-* provides pip +
      # gcovr's runtime deps for it; lxml has no wheel for this python
      # either, so pacman provides it rather than pip building it from
      # source.
      # NOTE: comments must NOT go inside the folded install list below —
      # setup-msys2 passes each line to pacman, so comment words would be
      # treated as package names.
      # Phase 5b: mingw-w64-x86_64-angleproject installs ANGLE
      # (libEGL.dll/libGLESv2.dll) so the render pipeline self-test runs
      # the real GL path headless on WARP in the ctest step (architecture
      # §3.3 Option B).
      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-make
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-python-lxml
            mingw-w64-x86_64-python-jinja
            mingw-w64-x86_64-python-pygments
            mingw-w64-x86_64-python-packaging
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-cppwinrt
            mingw-w64-x86_64-angleproject
            mingw-w64-x86_64-pango
            mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-glib2
            make
            patch

      # The FFmpeg stack (ffmpeg 9.0 + x264 + opus + mbedtls + srt +
      # nv-codec-headers, pinned and sha256-verified, built from source by
      # scripts/build-ffmpeg-windows.sh) is cached as a whole directory:
      # install prefix and per-library stamps. On a cache hit the stamp
      # check makes the build a no-op. The cache key tracks the source
      # pins (scripts/ffmpeg-sources.sh), the upstream patches, and the
      # build script itself (its ffmpeg configure flags live there; a
      # flags change must invalidate the cached prefix or the new flags
      # would never take effect). The script's per-library stamps still
      # rebuild only what changed, so diagnostic iterations restore the
      # built libs and re-run just the failing step.
      #
      # build/ffmpeg-sources is deliberately NOT cached: it is the
      # downloaded+extracted tarball trees (hundreds of MB of redundant
      # data — re-downloaded from the pins on a miss), and the payload was
      # the reason saves kept failing. The stamp check runs before any
      # download, so a cache hit never touches the sources dir.
      #
      # Restore and save are separate steps. The save runs even when a
      # later step fails (stamp-based and idempotent, so restoring a
      # partial prefix rebuilds only what's absent) BUT only when the
      # restore missed: actions/cache/save errors on an already-existing
      # key, so a successful save would otherwise fail the very next run's
      # save with "cache entry already exists" while doing nothing.
      - name: Restore FFmpeg build cache
        id: ffmpeg-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            build/ffmpeg-prefix
            build/ffmpeg-libs
          key: ffmpeg-v4-${{ hashFiles('scripts/ffmpeg-sources.sh', 'scripts/patches/*.patch', 'scripts/build-ffmpeg-windows.sh') }}

      - name: Build FFmpeg stack from source
        shell: msys2 {0}
        run: |
          ./scripts/build-ffmpeg-windows.sh

      - name: Save FFmpeg build cache
        if: always() && steps.ffmpeg-cache-restore.outputs.cache-hit != 'true'
        # actions/cache uploads are a known hang point on hosted runners; the
        # cache is only an optimization, so time it out and never fail the
        # build over it.
        timeout-minutes: 15
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/ffmpeg-prefix
            build/ffmpeg-libs
          key: ffmpeg-v4-${{ hashFiles('scripts/ffmpeg-sources.sh', 'scripts/patches/*.patch', 'scripts/build-ffmpeg-windows.sh') }}

      - name: Configure
        shell: msys2 {0}
        run: |
          # CMake finds the native pkgconf.exe (not MSYS2's pkg-config shell
          # wrapper), so it needs Windows-style paths joined with ';'.
          export PKG_CONFIG_PATH="$(cygpath -m "$PWD/build/ffmpeg-prefix/lib/pkgconfig");$(cygpath -m /mingw64/lib/pkgconfig)"
          cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPKG_CONFIG_EXECUTABLE="$(cygpath -m "$(command -v pkgconf.exe)")"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build/cmake --parallel

      # Bundle the pango/fontconfig/freetype/glib DLLs next to the binaries
      # that pull them (mgl test, the UI module test, and the gsr-ui app
      # itself — all link the pango text pipeline) so the direct runs (plain
      # runner) and the `test` job find them without MSYS2 — same DLLs the
      # installer will bundle (Phase 13/17).
      - name: Bundle pango DLLs next to mgl/UI binaries
        shell: msys2 {0}
        run: |
          for exe in build/cmake/mgl-win32-test.exe build/cmake/ui-module-test.exe build/cmake/ui-rpc-test.exe build/cmake/gsr-ui.exe build/cmake/gsr-ui-cli.exe; do
            for dll in $(ldd "$exe" 2>/dev/null | awk '{print $3}' | grep '^/mingw64/bin/'); do
              cp -n "$dll" "$(dirname "$exe")/" 2>/dev/null || true
            done
          done
          ls build/cmake/*.dll 2>/dev/null || echo "no dlls to bundle"

      # Phase 13: the engine loads ANGLE at runtime (dlopen libEGL.dll /
      # libGLESv2.dll in gsr_egl_win32.c), so the portable zip and installer
      # must ship those DLLs next to the exe. d3dcompiler_47.dll ships with
      # Windows 10+ in System32 and with MSYS2's ANGLE too; copy it when
      # present. These land in the artifact via build/cmake/*.dll.
      - name: Bundle ANGLE DLLs next to the engine
        shell: msys2 {0}
        run: |
          for dll in libEGL.dll libGLESv2.dll d3dcompiler_47.dll; do
            if [ -f "/mingw64/bin/$dll" ]; then
              cp -n "/mingw64/bin/$dll" build/cmake/ 2>/dev/null || true
            else
              echo "note: /mingw64/bin/$dll not present (system DLL on Windows 10+)"
            fi
          done
          if [ ! -f build/cmake/libEGL.dll ] || [ ! -f build/cmake/libGLESv2.dll ]; then
            echo "ANGLE DLLs missing from /mingw64/bin — the engine cannot capture without them"
            exit 1
          fi
          ls -la build/cmake/libEGL.dll build/cmake/libGLESv2.dll

      # FONTCONFIG_PATH: MSYS2's fontconfig has the package-builder's
      # sysconfdir (C:\msys64\etc\fonts) baked in, which doesn't exist on
      # the runner; tests/fonts.conf points fontconfig at C:/Windows/Fonts
      # so the mgl text pipeline (Phase 10 milestone B) finds real fonts.
      - name: Run unit tests (ctest)
        shell: msys2 {0}
        run: |
          export FONTCONFIG_PATH="$(cygpath -m "$PWD/tests")"
          # 120s per test: a hang fails fast instead of burning ctest's 1500s
          # default timeout (which is how a stuck test ate the whole runner).
          ctest --test-dir build/cmake --output-on-failure --timeout 120

      # Phase 5b: run the render pipeline self-test inside the MSYS2 shell so
      # ANGLE (libEGL.dll on /mingw64/bin PATH) is found and the full
      # D3D11->import->color_conversion->readback output is visible in the
      # logs (ctest only shows output on failure). SKIPs on the plain runner.
      - name: Run render pipeline self-test (ANGLE)
        shell: msys2 {0}
        run: ./build/cmake/render-self-test.exe

      # Run the test binaries directly as well: the executables run on any
      # Windows system, which is what the `test` job relies on (the mgl
      # binaries bundle their pango DLLs next to the exe).
      - name: Run tests directly (static-linked binaries)
        shell: pwsh
        run: |
          $env:FONTCONFIG_PATH = "$PWD\tests"
          .\build\cmake\ci-smoke.exe
          .\build\cmake\compat-probe.exe
          .\build\cmake\gsr-core-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\platform-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\wgc-self-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\render-self-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\dxgi-self-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\recorder-self-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\audio-conv-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\nvenc-self-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\audio-list-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\audio-sync-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\replay-save-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\mgl-win32-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\ui-rpc-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\ui-module-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\ui-golden-test.exe "$PWD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\engine-ipc-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\gsr-cli.exe -h
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cmake\gpu-screen-recorder.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Run the recorder self-test in the MSYS2 shell too: this is where the
      # ANGLE DLLs are on PATH, so the verbose recording logs (backend
      # chosen, video size, encoded packets, validated container) appear in
      # the CI logs — ctest only shows output on failure.
      - name: Run recorder self-test (ANGLE + live capture)
        shell: msys2 {0}
        run: ./build/cmake/recorder-self-test.exe

      # Same for the NVENC self-test: the -encoder gpu fallback recording
      # needs ANGLE + a capture backend, so the MSYS2 shell is the only
      # place it exercises the full path (headless checks already ran in
      # ctest).
      - name: Run NVENC self-test (ANGLE + live capture)
        shell: msys2 {0}
        run: ./build/cmake/nvenc-self-test.exe

      # Phase 11: the engine IPC test. Part 1 (the named-pipe transport
      # round-trips) runs in ctest; part 2 spawns the real
      # gpu-screen-recorder.exe with -ipc and drives it through gsr-cli
      # (status/toggle-pause/save-replay/stop + saved-file validation). It
      # needs ANGLE + a capture backend, so the MSYS2 shell is the only
      # place it exercises the full path.
      - name: Run engine IPC test (ANGLE + live engine)
        shell: msys2 {0}
        run: ./build/cmake/engine-ipc-test.exe

      # Phase 11: engine smoke — --info and --list-capture-options need
      # ANGLE (exit 22 without it), so run them here where the DLLs are on
      # PATH; the hags|yes|no line (HAGS hardening) must be present.
      - name: Run engine --info (ANGLE)
        shell: msys2 {0}
        run: |
          ./build/cmake/gpu-screen-recorder.exe --info
          ./build/cmake/gpu-screen-recorder.exe --list-capture-options
          ./build/cmake/gpu-screen-recorder.exe --list-audio-devices

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            build/cmake/ci-smoke.exe
            build/cmake/compat-probe.exe
            build/cmake/gsr-core-test.exe
            build/cmake/platform-test.exe
            build/cmake/wgc-self-test.exe
            build/cmake/render-self-test.exe
            build/cmake/dxgi-self-test.exe
            build/cmake/recorder-self-test.exe
            build/cmake/audio-conv-test.exe
            build/cmake/nvenc-self-test.exe
            build/cmake/nvenc-self-test-output.mkv
            build/cmake/audio-list-test.exe
            build/cmake/audio-sync-test.exe
            build/cmake/replay-save-test.exe
            build/cmake/mgl-win32-test.exe
            build/cmake/ui-rpc-test.exe
            build/cmake/ui-module-test.exe
            build/cmake/ui-golden-test.exe
            build/cmake/ui-golden-render.ppm
            build/cmake/gsr-ui.exe
            build/cmake/gsr-ui-cli.exe
            build/cmake/gpu-screen-recorder.exe
            build/cmake/gsr-cli.exe
            build/cmake/engine-ipc-test.exe
            build/cmake/recorder-self-test-output.mkv
            build/cmake/*.dll
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # Coverage (Phase 3 CI deliverable): a separate coverage-instrumented
      # build (never the release build) whose gcovr HTML report is uploaded
      # as an artifact. gcovr is python-based, run under the mingw64 python
      # (see setup step). --break-system-packages: MSYS2's python is
      # PEP 668 externally-managed, and gcovr is only packaged for the
      # clang64/ucrt64 repos, so a plain pip install is refused. The CI
      # runner is ephemeral, so overriding is safe here. Coverage of the
      # port's own code + vendored engine; tests and vendored externals are
      # excluded from the report.
      - name: Install gcovr
        shell: msys2 {0}
        run: |
          pip install --quiet --break-system-packages gcovr
          gcovr --version

      - name: Configure (coverage build)
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH="$(cygpath -m "$PWD/build/ffmpeg-prefix/lib/pkgconfig");$(cygpath -m /mingw64/lib/pkgconfig)"
          cmake -S . -B build/coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DGSR_ENABLE_COVERAGE=ON \
            -DPKG_CONFIG_EXECUTABLE="$(cygpath -m "$(command -v pkgconf.exe)")"

      - name: Build (coverage)
        shell: msys2 {0}
        run: cmake --build build/coverage --parallel

      - name: Run tests (coverage)
        shell: msys2 {0}
        run: |
          export FONTCONFIG_PATH="$(cygpath -m "$PWD/tests")"
          ctest --test-dir build/coverage --output-on-failure --timeout 120

      - name: Generate coverage report
        shell: msys2 {0}
        run: |
          mkdir -p build/coverage-report
          # gcovr runs under the mingw64 python (native Windows), which
          # resolves '--root .' to a Windows path matching the D:/... paths
          # embedded in the .gcno files.
          gcovr --root . --object-directory build/coverage \
            --html --html-details -o build/coverage-report/index.html \
            --exclude 'upstream/external/.*' \
            --exclude 'tests/.*' \
            --print-summary

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage-report
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # TEST
  # -------------------------------------------------------------------------
  # Runs the static-linked test executables produced by the build job. They
  # are statically linked against libgcc/libwinpthread and the static FFmpeg,
  # so they run on a plain windows-latest runner without MSYS2.
  test:
    name: Test
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: build/bin/
      - name: Run unit tests
        shell: pwsh
        run: |
          $env:FONTCONFIG_PATH = "$PWD\tests"
          .\build\bin\compat-probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\gsr-core-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\platform-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\wgc-self-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\render-self-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\dxgi-self-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\recorder-self-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\audio-conv-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\nvenc-self-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\audio-list-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\audio-sync-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\replay-save-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\mgl-win32-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\ui-rpc-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\ui-module-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\engine-ipc-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\bin\ci-smoke.exe

  # -------------------------------------------------------------------------
  # PACKAGE (Phase 13): assembles the portable ZIP and the Inno Setup
  # installer from the build artifact, and validates both (executables,
  # DLLs, license, embedded icon + version resources, --help/--version/
  # --info, archive round-trip). Runs on every push — packaging is part of
  # the validation pipeline, not just release time.
  # -------------------------------------------------------------------------
  package:
    name: Package (installer + portable zip)
    needs: [build, test]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # ISCC (Inno Setup 6 compiler) via chocolatey, which is preinstalled
      # on the windows-latest runner. choco installs can be flaky; retry.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          for ($i = 1; $i -le 3; $i++) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -eq 0 -and (Test-Path $iscc)) { break }
            Start-Sleep -Seconds 15
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after 3 choco attempts" }
          & $iscc /? | Select-Object -First 1
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: build/Release/
      - name: Build installer + portable zip
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "6.0.0-w3" }
          & .\packaging\build-package.ps1 `
            -BinDir (Resolve-Path .\build\Release) `
            -OutDir (Join-Path $PWD "dist") `
            -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            dist/GPU-Screen-Recorder-Windows-x64-Setup.exe
            dist/GPU-Screen-Recorder-Windows-x64-Portable.zip
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # RELEASE (Phase 14): publishes a GitHub Release ONLY when the workflow
  # was triggered by a `v*` tag push or a workflow_dispatch with a version
  # input (release policy §84). A plain main push / PR runs build+test+
  # package as validation but never creates a release.
  # -------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build, package]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.version != '') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: dist/
      # Release notes are auto-generated (packaging/make-release-notes.ps1)
      # from the version, commit SHA, upstream revision pins in
      # NOTICE-WINDOWS-PORT.md, the parity matrix's NOT POSSIBLE rows, and
      # the CI hardware reality statement — never claiming hardware testing
      # that did not happen (brief §64).
      - name: Generate release notes
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "6.0.0-w3" }
          & .\packaging\make-release-notes.ps1 `
            -Version $version `
            -Sha "${{ github.sha }}" `
            -OutPath "$PWD\release-notes.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content release-notes.md | Select-Object -First 30
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit tag: on a tag push this matches the triggering ref; on
          # workflow_dispatch the tag is created (release policy §84).
          tag_name: v${{ needs.build.outputs.version }}
          name: GPU Screen Recorder ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/GPU-Screen-Recorder-Windows-x64-Setup.exe
            dist/GPU-Screen-Recorder-Windows-x64-Portable.zip
